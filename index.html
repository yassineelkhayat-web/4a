<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Scolaire | Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .time-slot { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .time-slot:hover:not(.pause) { 
            transform: scale(1.02); 
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .pause { 
            background: rgba(0, 0, 0, 0.05) !important; 
            backdrop-filter: blur(4px);
            border: 1px dashed rgba(0,0,0,0.1) !important; 
            color: #64748b;
        }
        .modal-animate { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Personnalisation Scrollbar style Apple */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="glass-card p-10 rounded-[2rem] text-center max-w-sm w-full modal-animate">
            <div class="w-20 h-20 bg-white rounded-2xl shadow-inner mx-auto mb-6 flex items-center justify-center text-4xl">📚</div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Bienvenue</h1>
            <p class="text-gray-500 mb-8 text-sm">Connecte-toi pour voir l'agenda</p>
            <input type="text" id="username" placeholder="Ton prénom..." class="w-full p-4 bg-white/50 border border-white/50 rounded-2xl mb-4 focus:ring-2 ring-blue-400 outline-none transition-all">
            <button onclick="login()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95">Entrer</button>
        </div>
    </div>

    <div id="main-content" class="hidden max-w-7xl mx-auto">
        <header class="glass-card rounded-[2rem] p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Emploi du Temps</h1>
                <p id="welcome-user" class="text-gray-500 font-medium"></p>
            </div>
            <div class="flex gap-2">
                <span class="px-4 py-2 bg-white/50 rounded-full text-xs font-bold text-blue-600 border border-white">2025-2026</span>
            </div>
        </header>

        <div class="glass-card rounded-[2.5rem] overflow-hidden">
            <div class="p-6 overflow-x-auto">
                <div class="grid grid-cols-6 gap-4 min-w-[1000px]">
                    <div class="h-12"></div>
                    <div class="flex items-center justify-center font-bold text-gray-700 h-12">Lundi</div>
                    <div class="flex items-center justify-center font-bold text-gray-700 h-12">Mardi</div>
                    <div class="flex items-center justify-center font-bold text-gray-700 h-12">Mercredi</div>
                    <div class="flex items-center justify-center font-bold text-gray-700 h-12">Jeudi</div>
                    <div class="flex items-center justify-center font-bold text-gray-700 h-12">Vendredi</div>
                    <div id="timetable-rows" class="contents"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm">
        <div class="glass-card w-full max-w-4xl max-h-[85vh] rounded-[2.5rem] overflow-hidden flex flex-col modal-animate">
            <div class="p-6 border-b border-white/50 flex justify-between items-center bg-white/30">
                <div>
                    <h2 id="detail-title" class="text-xl font-bold text-gray-800">Détails</h2>
                    <p id="detail-course" class="text-sm text-blue-600 font-bold uppercase tracking-wider"></p>
                </div>
                <button onclick="closeModal('detail-modal')" class="w-10 h-10 flex items-center justify-center bg-white/50 rounded-full hover:bg-white transition-colors text-2xl">&times;</button>
            </div>
            
            <div class="flex flex-col md:flex-row overflow-hidden flex-1">
                <div class="w-full md:w-1/2 p-6 overflow-y-auto border-r border-white/50">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-4 tracking-widest">Travaux à faire</h3>
                    <div id="detail-items-list" class="space-y-3 mb-6"></div>
                    
                    <div class="bg-white/40 p-4 rounded-3xl border border-white">
                        <div class="flex gap-2 mb-2">
                            <select id="work-type" class="bg-white/80 p-2 rounded-xl text-xs font-bold border-none outline-none">
                                <option value="Devoir">📚 Devoir</option>
                                <option value="Evaluation">🔥 Évaluation</option>
                            </select>
                        </div>
                        <textarea id="task" placeholder="Une consigne, un exercice..." class="w-full p-3 bg-white/80 rounded-2xl border-none outline-none text-sm mb-2" rows="2"></textarea>
                        <button onclick="addHomework()" class="w-full py-3 bg-gray-800 text-white font-bold rounded-2xl hover:bg-black transition-all">Ajouter</button>
                    </div>
                </div>

                <div class="w-full md:w-1/2 p-6 bg-white/20 flex flex-col">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-4 tracking-widest">Discussion</h3>
                    <div id="comments-container" class="flex-1 overflow-y-auto space-y-3 mb-4 text-sm">
                        <p class="text-center text-gray-400 mt-10">Sélectionne un devoir pour chatter</p>
                    </div>
                    <div id="comment-input-area" class="hidden flex gap-2">
                        <input type="text" id="comment-text" placeholder="Ton message..." class="flex-1 p-3 bg-white rounded-2xl border-none outline-none shadow-sm">
                        <button onclick="sendComment()" class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-blue-100">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION SUPABASE (Garde tes clés) ---
        const SUPABASE_URL = 'https://ocoybixjephoicpwggpo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UbX9TrzivRZ6_HPYIb1SLQ_TveqS6aS';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const schedule = {
            "08:15": ["Anglais", "Géographie", "Physique", "Mathématiques", "Néerlandais"],
            "09:20": ["Anglais", "Histoire", "Physique", "Mathématiques", "Néerlandais"],
            "10:10": ["Biologie", "Religion", "Mathématiques", "Français", "Français"],
            "11:00": ["PAUSE", "PAUSE", "PAUSE", "PAUSE", "PAUSE"],
            "11:20": ["Chimie", "Religion", "Français", "Français", "Gymnastique"],
            "12:10": ["Chimie", "Néerlandais", "Français", "Histoire", "Gymnastique"],
            "13:00": ["PAUSE", "PAUSE", "PAUSE", "PAUSE", "PAUSE"],
            "14:15": ["Mathématiques", "Anglais", "Cours Vide", "Néerlandais", "Cours Vide"],
            "15:20": ["Mathématiques", "Anglais", "Cours Vide", "Géographie", "Cours Vide"],
            "16:10": ["Cours Vide", "Anglais", "Cours Vide", "Cours Vide", "Cours Vide"]
        };

        let currentUser = "";
        let selectedDay = "";
        let selectedHour = "";
        let activeDevoirId = null;

        function login() {
            const name = document.getElementById('username').value;
            if (name.trim()) {
                currentUser = name;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('welcome-user').innerText = "Heureux de te revoir, " + currentUser + " 👋";
                initApp();
            }
        }

        function initApp() {
            generateGrid();
            fetchDevoirs();
        }

        function generateGrid() {
            const days = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
            const container = document.getElementById('timetable-rows');
            container.innerHTML = "";

            Object.keys(schedule).forEach(time => {
                container.innerHTML += `<div class="flex items-center justify-center text-[11px] font-bold text-gray-400">${time}</div>`;
                days.forEach((day, index) => {
                    const course = schedule[time][index];
                    const isPause = course === "PAUSE";
                    const isEmpty = course === "Cours Vide";
                    
                    container.innerHTML += `
                        <div id="cell-${day}-${time}" 
                             onclick="${!isPause ? `openDetail('${day}', '${time}', '${course}')` : ''}" 
                             class="time-slot rounded-[1.5rem] p-3 min-h-[100px] flex flex-col ${isPause ? 'pause' : ''}">
                             ${isPause ? '<span class="m-auto text-[10px] tracking-widest opacity-50 uppercase">Pause</span>' : 
                             `<span class="text-[10px] font-extrabold text-blue-500 uppercase mb-1">${isEmpty ? 'Libre' : course}</span>`}
                             <div class="content-area space-y-1"></div>
                        </div>`;
                });
            });
        }

        function openDetail(day, hour, course) {
            selectedDay = day;
            selectedHour = hour;
            document.getElementById('detail-title').innerText = `${day} à ${hour}`;
            document.getElementById('detail-course').innerText = (course === "Cours Vide") ? "Cours Libre" : course;
            document.getElementById('detail-modal').classList.remove('hidden');
            refreshDetailList();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            activeDevoirId = null;
        }

        async function addHomework() {
            const tsk = document.getElementById('task').value;
            const type = document.getElementById('work-type').value;
            const course = document.getElementById('detail-course').innerText;
            if(!tsk) return;

            const { error } = await _supabase.from('devoirs').insert([{ 
                matiere: course, description: tsk, jour: selectedDay, 
                heure: selectedHour, auteur: currentUser, type: type 
            }]);

            if(error) alert("Erreur : " + error.message);
            document.getElementById('task').value = "";
            refreshDetailList();
            fetchDevoirs();
        }

        async function refreshDetailList() {
            const { data } = await _supabase.from('devoirs').select('*').eq('jour', selectedDay).eq('heure', selectedHour);
            const list = document.getElementById('detail-items-list');
            list.innerHTML = data.length === 0 ? "<p class='text-gray-400 italic text-center py-10'>Rien pour le moment.</p>" : "";
            
            data.forEach(d => {
                const isEval = d.type === 'Evaluation';
                list.innerHTML += `
                    <div onclick="selectDevoir(${d.id})" class="p-4 bg-white/60 rounded-2xl cursor-pointer border-l-4 ${isEval ? 'border-red-400' : 'border-blue-400'} hover:bg-white transition-all shadow-sm ${activeDevoirId === d.id ? 'ring-2 ring-blue-500' : ''}">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[9px] font-black uppercase ${isEval ? 'text-red-500' : 'text-blue-500'}">${d.type}</span>
                            <span class="text-[9px] text-gray-400">Par ${d.auteur}</span>
                        </div>
                        <div class="text-sm font-medium text-gray-800">${d.description}</div>
                    </div>`;
            });
        }

        function selectDevoir(id) {
            activeDevoirId = id;
            document.getElementById('comment-input-area').classList.remove('hidden');
            refreshDetailList();
            loadComments(id);
        }

        async function loadComments(id) {
            const { data } = await _supabase.from('commentaires').select('*').eq('devoir_id', id).order('created_at');
            const container = document.getElementById('comments-container');
            container.innerHTML = "";
            data.forEach(c => {
                const isMe = c.auteur === currentUser;
                container.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <div class="px-3 py-2 rounded-2xl max-w-[80%] ${isMe ? 'bg-blue-600 text-white' : 'bg-white text-gray-800'} shadow-sm">
                            <p class="text-xs font-bold mb-1 opacity-70">${c.auteur}</p>
                            ${c.message}
                        </div>
                    </div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendComment() {
            const msg = document.getElementById('comment-text').value;
            if(!msg) return;
            await _supabase.from('commentaires').insert([{ devoir_id: activeDevoirId, auteur: currentUser, message: msg }]);
            document.getElementById('comment-text').value = "";
            loadComments(activeDevoirId);
        }

        async function fetchDevoirs() {
            const { data } = await _supabase.from('devoirs').select('*');
            if(!data) return;
            document.querySelectorAll('.content-area').forEach(div => div.innerHTML = "");
            data.forEach(d => {
                const cell = document.getElementById(`cell-${d.jour}-${d.heure}`);
                if (cell) {
                    const isEval = d.type === 'Evaluation';
                    cell.querySelector('.content-area').innerHTML += `
                        <div class="text-[9px] px-2 py-1 rounded-lg truncate font-bold ${isEval ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}">
                            ${isEval ? '⚠️' : '•'} ${d.description}
                        </div>`;
                }
            });
        }
        setInterval(fetchDevoirs, 10000);
    </script>
</body>
</html>
